name: Build NET4.8 Exe
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SOLUTION_NAME: 进程一键结束.sln
  CSPROJ_PATH: 进程一键结束\进程一键结束.csproj

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Release]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: 编译项目
      run: msbuild $env:CSPROJ_PATH /p:Configuration=${{ matrix.configuration }} /p:Platform="AnyCPU"

    - name: 上传编译产物
      uses: actions/upload-artifact@v4
      with:
        name: NET48-Build-${{ matrix.configuration }}
        path: 进程一键结束\bin\Release
